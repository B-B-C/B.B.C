{% extends 'forum/base.html' %}
{% block content %}
<h2>Удалить тему?</h2>
<p>Вы уверены, что хотите удалить тему "{{ post.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'thread-detail' post.id %}">Отмена</a>
</form>
{% endblock %}
